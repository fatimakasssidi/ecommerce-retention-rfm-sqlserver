<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Two databases and their schemas</title>
<desc id="d">Source files are loaded into the raw database (bronze schema), then cleaned into the dwh database (silver, gold, serving schemas) and consumed by Power BI.</desc>
<style>
text{font-family:"Segoe UI",Arial,Helvetica,sans-serif}
.th{font-size:14px;font-weight:600;fill:#2c2c2a}
.ts{font-size:12px;fill:#444441}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
.box{stroke-width:1}
.db{fill:none;stroke:#888780;stroke-width:1;stroke-dasharray:4 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="640" fill="#ffffff"/>

<rect class="box" x="130" y="20" width="240" height="50" rx="8" fill="#e6e4dc" stroke="#888780"/>
<text class="th" x="250" y="38" text-anchor="middle" dominant-baseline="central">REES46 events</text>
<text class="ts" x="250" y="56" text-anchor="middle" dominant-baseline="central">2 CSV files, about 15 GB</text>
<line class="arr" x1="250" y1="74" x2="250" y2="106" marker-end="url(#arrow)"/>
<text class="ts" x="466" y="92" dominant-baseline="central">files loaded as they are</text>

<rect class="db" x="30" y="110" width="620" height="130" rx="16"/>
<text class="th" x="50" y="134">Database 1 · ecommerce_rfm_raw</text>
<text class="ts" x="630" y="134" text-anchor="end">SIMPLE recovery · disposable · no backup</text>
<rect class="box" x="50" y="152" width="400" height="64" rx="8" fill="#f5c4b3" stroke="#993c1d"/>
<text class="th" x="250" y="173" text-anchor="middle" dominant-baseline="central">bronze schema</text>
<text class="ts" x="250" y="194" text-anchor="middle" dominant-baseline="central">Raw copy of the source files, no cleaning</text>
<rect class="box" x="470" y="152" width="160" height="64" rx="8" fill="#e6e4dc" stroke="#888780"/>
<text class="th" x="550" y="173" text-anchor="middle" dominant-baseline="central">audit schema</text>
<text class="ts" x="550" y="194" text-anchor="middle" dominant-baseline="central">Load logs</text>

<line class="arr" x1="250" y1="244" x2="250" y2="286" marker-end="url(#arrow)"/>
<text class="ts" x="266" y="266" dominant-baseline="central">load_silver: clean and type the data</text>

<rect class="db" x="30" y="290" width="620" height="220" rx="16"/>
<text class="th" x="50" y="314">Database 2 · ecommerce_rfm_dwh</text>
<text class="ts" x="630" y="314" text-anchor="end">FULL recovery · protected · backed up</text>

<rect class="box" x="50" y="332" width="160" height="76" rx="8" fill="#d3d1c7" stroke="#5f5e5a"/>
<text class="th" x="130" y="352" text-anchor="middle" dominant-baseline="central">silver schema</text>
<text class="ts" x="130" y="372" text-anchor="middle" dominant-baseline="central">Cleaned and typed</text>
<text class="ts" x="130" y="390" text-anchor="middle" dominant-baseline="central">Duplicates removed</text>
<rect class="box" x="250" y="332" width="160" height="76" rx="8" fill="#fac775" stroke="#854f0b"/>
<text class="th" x="330" y="352" text-anchor="middle" dominant-baseline="central">gold schema</text>
<text class="ts" x="330" y="372" text-anchor="middle" dominant-baseline="central">Business model</text>
<text class="ts" x="330" y="390" text-anchor="middle" dominant-baseline="central">Dimensions and facts</text>
<rect class="box" x="450" y="332" width="160" height="76" rx="8" fill="#9fe1cb" stroke="#0f6e56"/>
<text class="th" x="530" y="352" text-anchor="middle" dominant-baseline="central">serving schema</text>
<text class="ts" x="530" y="372" text-anchor="middle" dominant-baseline="central">Views for Power BI</text>
<text class="ts" x="530" y="390" text-anchor="middle" dominant-baseline="central">The contract</text>
<line class="arr" x1="212" y1="370" x2="246" y2="370" marker-end="url(#arrow)"/>
<line class="arr" x1="412" y1="370" x2="446" y2="370" marker-end="url(#arrow)"/>

<rect class="box" x="50" y="428" width="560" height="56" rx="8" fill="#e6e4dc" stroke="#888780"/>
<text class="th" x="330" y="446" text-anchor="middle" dominant-baseline="central">audit schema</text>
<text class="ts" x="330" y="466" text-anchor="middle" dominant-baseline="central">ETL runs, errors, data quality results, rejected rows</text>

<line class="arr" x1="530" y1="514" x2="530" y2="546" marker-end="url(#arrow)"/>
<rect class="box" x="450" y="550" width="160" height="56" rx="8" fill="#cecbf6" stroke="#534ab7"/>
<text class="th" x="530" y="570" text-anchor="middle" dominant-baseline="central">Power BI</text>
<text class="ts" x="530" y="589" text-anchor="middle" dominant-baseline="central">Model and report</text>

<text class="ts" x="50" y="566" dominant-baseline="central">Data flows one way:</text>
<text class="ts" x="50" y="586" dominant-baseline="central">bronze, silver, gold, serving</text>
</svg>
